name: Check VPN services uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger uptime check on deployed site
        run: |
          curl -sf -X POST "${SITE_URL}/api/cron/check" \
            -H "x-cron-secret: ${CRON_SECRET}"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
